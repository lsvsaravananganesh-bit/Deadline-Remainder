<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard — Deadline Guardian</title><style>
:root{--bg:#070707;--panel:#101010;--line:#292929;--muted:#858585;--lime:#bef264}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f5f5f5;font:14px/1.5 system-ui}.wrap{max-width:1100px;margin:auto;padding:0 20px}.top{border-bottom:1px solid #181818}.topin{height:72px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900}.brand i{display:inline-grid;place-items:center;background:var(--lime);color:#050505;border-radius:10px;width:34px;height:34px;margin-right:9px;font-style:normal}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:#111;color:#eee;border-radius:11px;padding:10px 13px;cursor:pointer;font-weight:700}.primary{background:var(--lime);color:#050505;border-color:var(--lime)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:26px 0}.stat,.panel,.item{background:#0e0e0e;border:1px solid var(--line);border-radius:17px;padding:17px}.stat span{color:#777}.stat b{display:block;font-size:29px;margin-top:6px}.panel{margin-bottom:18px}.panel h2{margin:0 0 4px}.muted{color:#777}.capture{display:flex;gap:8px;margin-top:14px}.capture input{flex:1}.input{width:100%;padding:12px;border:1px solid var(--line);background:#070707;color:#fff;border-radius:11px}.list{display:grid;gap:9px}.item{display:flex;align-items:center;gap:12px}.check{width:35px;height:35px;border:1px solid #3a3a3a;background:#111;color:#bef264;border-radius:10px;cursor:pointer}.grow{flex:1;min-width:0}.grow b{font-size:15px}.meta{color:#777;margin-top:3px;font-size:12px}.priority{font-size:11px;color:#bef264;text-transform:uppercase;font-weight:800}.danger{color:#fda4af;background:none;border:0;cursor:pointer}.empty{text-align:center;padding:35px;color:#777}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:20px}.dialog{width:min(480px,100%);background:#101010;border:1px solid #303030;border-radius:20px;padding:22px}.dialog .row{display:flex;justify-content:space-between;align-items:center}.dialog button{margin-top:12px}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.capture{flex-direction:column}.item{align-items:flex-start}.priority{display:none}}</style></head>
<body><header class="top"><div class="wrap topin"><div class="brand"><i>✓</i>Deadline Guardian<div id="email" class="muted" style="font-size:11px;font-weight:400"></div></div><div class="actions"><button class="btn primary" id="add">+ Add deadline</button><button class="btn" id="out">Sign out</button></div></div></header>
<main class="wrap"><div class="stats"><div class="stat"><span>Active</span><b id="active">0</b></div><div class="stat"><span>Overdue</span><b id="overdue">0</b></div><div class="stat"><span>Today</span><b id="today">0</b></div><div class="stat"><span>Completed</span><b id="completed">0</b></div></div>
<section class="panel"><h2>Quick deadline capture ✦</h2><div class="muted">Paste a sentence and Guardian will create a draft for you to confirm.</div><div class="capture"><input id="capture" class="input" placeholder="Submit the report by Friday at 5 PM"><button class="btn primary" id="extract">Extract</button></div></section>
<section><h2>Your deadlines</h2><div id="list" class="list"></div></section></main>
<div id="modal" class="modal" style="display:none"><div class="dialog"><div class="row"><h2>Confirm deadline</h2><button class="btn" id="close">✕</button></div><input id="title" class="input" placeholder="Task name"><input id="due" class="input" type="datetime-local"><select id="priority" class="input"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option><option value="critical">Critical</option></select><button class="btn primary" id="save" style="width:100%">Save deadline</button></div></div>
<script type="module">
import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const sb=createClient("https://jpqbvliaaucyqnhcclbz.supabase.co","sb_publishable_K-0R9a2lSginTIfxHk-cxQ_joorBonP");let user,items=[];
const $=id=>document.getElementById(id);
const fmt=iso=>new Date(iso).toLocaleString([], {dateStyle:"medium",timeStyle:"short"});
const remaining=iso=>{let m=Math.floor((new Date(iso)-Date.now())/60000);if(m<=0)return"Overdue";let d=Math.floor(m/1440);m%=1440;let h=Math.floor(m/60);m%=60;return d?d+"d "+h+"h":h?h+"h "+m+"m":m+"m"};
async function load(){const {data:{user:u}}=await sb.auth.getUser();if(!u){location.href="../auth/";return}user=u;$("email").textContent=u.email||"";const {data,error}=await sb.from("deadlines").select("*").eq("user_id",u.id).order("due_at",{ascending:true});if(error){$("list").innerHTML='<div class="empty">Could not load deadlines: '+error.message+"</div>";return}items=data||[];render()}
function render(){const active=items.filter(x=>x.status==="active"),over=active.filter(x=>new Date(x.due_at)<new Date()),today=active.filter(x=>new Date(x.due_at).toDateString()===new Date().toDateString()),done=items.filter(x=>x.status==="completed");$("active").textContent=active.length;$("overdue").textContent=over.length;$("today").textContent=today.length;$("completed").textContent=done.length;$("list").innerHTML=active.length?active.map(x=>'<article class="item"><button class="check" data-complete="'+x.id+'">✓</button><div class="grow"><b>'+esc(x.title)+'</b><div class="meta">'+remaining(x.due_at)+' remaining · '+fmt(x.due_at)+'</div></div><span class="priority">'+x.priority+'</span><button class="danger" data-delete="'+x.id+'">Delete</button></article>').join(""):'<div class="panel empty">No active deadlines yet. Add your first one.</div>'}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
$("list").onclick=async e=>{const c=e.target.closest("[data-complete]"),d=e.target.closest("[data-delete]");if(c){await sb.from("deadlines").update({status:"completed",completed_at:new Date().toISOString()}).eq("id",c.dataset.complete);await load()}if(d){await sb.from("deadlines").delete().eq("id",d.dataset.delete);await load()}};
function open(title="",due=""){ $("title").value=title;$("due").value=due||new Date(Date.now()+86400000).toISOString().slice(0,16);$("priority").value="medium";$("modal").style.display="grid"}
$("add").onclick=()=>open();$("close").onclick=()=>$("modal").style.display="none";$("save").onclick=async()=>{if(!$("title").value||!$("due").value)return;await sb.from("deadlines").insert({user_id:user.id,title:$("title").value,due_at:new Date($("due").value).toISOString(),priority:$("priority").value,source:"manual"});$("modal").style.display="none";await load()};
$("extract").onclick=()=>{const raw=$("capture").value.trim();if(!raw)return;const title=raw.replace(/\s+(by|on)\s+.+$/i,"").trim()||raw;open(title)};
$("out").onclick=async()=>{await sb.auth.signOut();location.href="../"};load();
</script></body></html>
