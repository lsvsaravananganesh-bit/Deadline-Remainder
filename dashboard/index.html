<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard — Deadline Guardian</title><style>
:root{--bg:#070707;--panel:#101010;--line:#292929;--muted:#858585;--lime:#bef264}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f5f5f5;font:14px/1.5 system-ui}.wrap{max-width:1100px;margin:auto;padding:0 20px}.top{border-bottom:1px solid #181818}.topin{height:72px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900}.brand i{display:inline-grid;place-items:center;background:var(--lime);color:#050505;border-radius:10px;width:34px;height:34px;margin-right:9px;font-style:normal}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:#111;color:#eee;border-radius:11px;padding:10px 13px;cursor:pointer;font-weight:700}.primary{background:var(--lime);color:#050505;border-color:var(--lime)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:26px 0}.stat,.panel,.item{background:#0e0e0e;border:1px solid var(--line);border-radius:17px;padding:17px}.stat span{color:#777}.stat b{display:block;font-size:29px;margin-top:6px}.panel{margin-bottom:18px}.panel h2{margin:0 0 4px}.muted{color:#777}.capture{display:flex;gap:8px;margin-top:14px}.capture input{flex:1}.input{width:100%;padding:12px;border:1px solid var(--line);background:#070707;color:#fff;border-radius:11px}.list{display:grid;gap:9px}.item{display:flex;align-items:center;gap:12px}.check{width:35px;height:35px;border:1px solid #3a3a3a;background:#111;color:#bef264;border-radius:10px;cursor:pointer}.grow{flex:1;min-width:0}.grow b{font-size:15px}.meta{color:#777;margin-top:3px;font-size:12px}.priority{font-size:11px;color:#bef264;text-transform:uppercase;font-weight:800}.danger{color:#fda4af;background:none;border:0;cursor:pointer}.empty{text-align:center;padding:35px;color:#777}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:20px}.dialog{width:min(480px,100%);background:#101010;border:1px solid #303030;border-radius:20px;padding:22px}.dialog .row{display:flex;justify-content:space-between;align-items:center}.dialog button{margin-top:12px}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.capture{flex-direction:column}.item{align-items:flex-start}.priority{display:none}} .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tabs{display:flex;gap:6px;flex-wrap:wrap}.tab{border:1px solid var(--line);background:#111;color:#aaa;border-radius:10px;padding:8px 11px;cursor:pointer}.tab.active{background:var(--lime);color:#050505}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}.day{min-height:70px;border:1px solid #242424;border-radius:10px;padding:7px;background:#0a0a0a}.dot{display:block;color:var(--lime);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.analytics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.metric{border:1px solid #292929;border-radius:12px;padding:12px}.metric b{display:block;font-size:21px}@media(max-width:700px){.analytics{grid-template-columns:repeat(2,1fr)}.calendar{gap:3px}.day{min-height:55px;padding:5px}}</style></head>
<body><header class="top"><div class="wrap topin"><div class="brand"><i>✓</i>Deadline Guardian<div id="email" class="muted" style="font-size:11px;font-weight:400"></div></div><div class="actions"><button class="btn primary" id="add">+ Add deadline</button><button class="btn" id="out">Sign out</button></div></div></header>
<main class="wrap"><div class="stats"><div class="stat"><span>Active</span><b id="active">0</b></div><div class="stat"><span>Overdue</span><b id="overdue">0</b></div><div class="stat"><span>Today</span><b id="today">0</b></div><div class="stat"><span>Completed</span><b id="completed">0</b></div></div>
<section class="panel"><h2>Quick deadline capture ✦</h2><div class="muted">Type naturally — Guardian detects common dates like today, tomorrow, Friday, and time such as 5 PM.</div><div class="capture"><input id="capture" class="input" placeholder="Submit project report by Friday at 5 PM"><button class="btn primary" id="extract">Extract</button></div></section>
<section class="panel"><div class="toolbar"><input id="search" class="input" placeholder="Search deadlines..."><div class="tabs"><button class="tab active" data-filter="all">All</button><button class="tab" data-filter="today">Today</button><button class="tab" data-filter="upcoming">Upcoming</button><button class="tab" data-filter="overdue">Overdue</button><button class="tab" data-filter="completed">Completed</button></div></div><div id="list" class="list"></div></section><section class="panel"><h2>Calendar</h2><div id="calendar" class="calendar"></div></section><section class="panel"><h2>Analytics</h2><div class="analytics"><div class="metric">Completion<b id="rate">0%</b></div><div class="metric">Next deadline<b id="next">—</b></div><div class="metric">High/Critical<b id="highCount">0</b></div><div class="metric">Overdue rate<b id="overRate">0%</b></div></div></section></main>
<div id="modal" class="modal" style="display:none"><div class="dialog"><div class="row"><h2>Confirm deadline</h2><button class="btn" id="close">✕</button></div><input id="title" class="input" placeholder="Task name"><input id="due" class="input" type="datetime-local"><select id="priority" class="input"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option><option value="critical">Critical</option></select><button class="btn primary" id="save" style="width:100%">Save deadline</button></div></div>
<script type="module">
import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const sb=createClient("https://jpqbvliaaucyqnhcclbz.supabase.co","sb_publishable_K-0R9a2lSginTIfxHk-cxQ_joorBonP");let user,items=[];
const $=id=>document.getElementById(id);
const fmt=iso=>new Date(iso).toLocaleString([], {dateStyle:"medium",timeStyle:"short"});
function parseDeadline(raw){
  const now=new Date(), s=raw.trim(), lower=s.toLowerCase(); const rel=lower.match(/in\\s+(\\d+)\\s+(minute|minutes|hour|hours|day|days|week|weeks)/); if(rel){const d=new Date(now),v=Number(rel[1]),u=rel[2];d.setTime(now.getTime()+v*(u.startsWith("minute")?60000:u.startsWith("hour")?3600000:u.startsWith("day")?86400000:604800000));return d;}
  let due=new Date(now);
  const timeMatch=lower.match(/(?:at\\s*)?(\\d{1,2})(?::(\\d{2}))?\\s*(am|pm)?/i);
  if(lower.includes("tomorrow")) due.setDate(due.getDate()+1);
  else if(lower.includes("today")) {}
  else {
    const days=["sunday","monday","tuesday","wednesday","thursday","friday","saturday"];
    const found=days.findIndex(d=>lower.includes(d));
    if(found>=0){let diff=(found-now.getDay()+7)%7;if(diff===0)diff=7;due.setDate(due.getDate()+diff);}
    else {
      const dateMatch=lower.match(/(?:on\\s+)?(\\d{1,2})[\\/\\-](\\d{1,2})(?:[\\/\\-](\\d{2,4}))?/);
      if(dateMatch){let y=dateMatch[3]?Number(dateMatch[3]):now.getFullYear();if(y<100)y+=2000;due=new Date(y,Number(dateMatch[2])-1,Number(dateMatch[1]),now.getHours(),now.getMinutes());}
      else due.setDate(due.getDate()+1);
    }
  }
  if(timeMatch){
    let h=Number(timeMatch[1]), m=Number(timeMatch[2]||0), ap=timeMatch[3];
    if(ap){if(ap.toLowerCase()==="pm"&&h<12)h+=12;if(ap.toLowerCase()==="am"&&h===12)h=0;}
    due.setHours(h,m,0,0);
  }
  if(due<=now) due.setDate(due.getDate()+1);
  return due;
}
let filter="all", search=""; const stageFor=x=>{if(x.status!=="active")return"completed";const m=(new Date(x.due_at)-Date.now())/60000;if(m<=0)return"overdue";if(m<=60)return"critical";if(m<=360)return"urgent";if(m<=1440)return"important";if(m<=10080)return"reminder";return"upcoming"}; const remaining=iso=>{let m=Math.floor((new Date(iso)-Date.now())/60000);if(m<=0)return"Overdue";let d=Math.floor(m/1440);m%=1440;let h=Math.floor(m/60);m%=60;return d?d+"d "+h+"h":h?h+"h "+m+"m":m+"m"};
async function load(){const {data:{user:u}}=await sb.auth.getUser();if(!u){location.href="../auth/";return}user=u;$("email").textContent=u.email||"";const {data,error}=await sb.from("deadlines").select("*").eq("user_id",u.id).order("due_at",{ascending:true});if(error){$("list").innerHTML='<div class="empty">Could not load deadlines: '+error.message+"</div>";return}items=data||[];render()}
function render(){const active=items.filter(x=>x.status==="active"),over=active.filter(x=>new Date(x.due_at)<new Date()),today=active.filter(x=>new Date(x.due_at).toDateString()===new Date().toDateString()),done=items.filter(x=>x.status==="completed");$("active").textContent=active.length;$("overdue").textContent=over.length;$("today").textContent=today.length;$("completed").textContent=done.length;const visible=items.filter(x=>{const q=search.toLowerCase();if(q&&!x.title.toLowerCase().includes(q))return false;const s=stageFor(x);if(filter==="today")return s!=="completed"&&new Date(x.due_at).toDateString()===new Date().toDateString();if(filter==="upcoming")return ["upcoming","reminder","important","urgent","critical"].includes(s);if(filter==="overdue")return s==="overdue";if(filter==="completed")return s==="completed";return true});$("list").innerHTML=visible.length?visible.map(x=>'<article class="item"><button class="check" data-complete="'+x.id+'">✓</button><div class="grow"><b>'+esc(x.title)+'</b><div class="meta">'+remaining(x.due_at)+' remaining · '+fmt(x.due_at)+'</div></div><span class="priority">'+x.priority+'</span><button class="danger" data-delete="'+x.id+'">Delete</button></article>').join(""):'<div class="panel empty">No active deadlines yet. Add your first one.</div>'}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
$("list").onclick=async e=>{const c=e.target.closest("[data-complete]"),d=e.target.closest("[data-delete]");if(c){await sb.from("deadlines").update({status:"completed",completed_at:new Date().toISOString()}).eq("id",c.dataset.complete);await load()}if(d){await sb.from("deadlines").delete().eq("id",d.dataset.delete);await load()}};
function open(title="",due=""){ $("title").value=title;$("due").value=due||new Date(Date.now()+86400000).toISOString().slice(0,16);$("priority").value="medium";$("modal").style.display="grid"}
$("add").onclick=()=>open();$("close").onclick=()=>$("modal").style.display="none";$("save").onclick=async()=>{if(!$("title").value||!$("due").value)return;await sb.from("deadlines").insert({user_id:user.id,title:$("title").value,due_at:new Date($("due").value).toISOString(),priority:$("priority").value,source:"manual"});$("modal").style.display="none";await load()};
$("extract").onclick=()=>{const raw=$("capture").value.trim();if(!raw)return;const title=raw.replace(/\s+(by|on)\s+.+$/i,"").trim()||raw;open(title)};
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");filter=b.dataset.filter;render()});$("search").oninput=e=>{search=e.target.value;render()};function renderCalendar(){const base=new Date();const y=base.getFullYear(),m=base.getMonth(),days=new Date(y,m+1,0).getDate(),start=new Date(y,m,1).getDay();let h="";for(let i=0;i<start;i++)h+="<div></div>";for(let d=1;d<=days;d++){const key=new Date(y,m,d).toDateString(),a=items.filter(x=>x.status==="active"&&new Date(x.due_at).toDateString()===key);h+='<div class="day"><b>'+d+'</b>'+a.slice(0,2).map(x=>'<span class="dot">• '+esc(x.title)+'</span>').join("")+"</div>"}$("calendar").innerHTML=h}function renderAnalytics(){const done=items.filter(x=>x.status==="completed").length,active=items.filter(x=>x.status==="active"),over=active.filter(x=>new Date(x.due_at)<new Date()).length,total=items.length;$("rate").textContent=total?Math.round(done/total*100)+"%":"0%";$("overRate").textContent=active.length?Math.round(over/active.length*100)+"%":"0%";$("highCount").textContent=active.filter(x=>["high","critical"].includes(x.priority)).length;const nx=active.filter(x=>new Date(x.due_at)>new Date()).sort((a,b)=>new Date(a.due_at)-new Date(b.due_at))[0];$("next").textContent=nx?remaining(nx.due_at):"—"}const oldRender=render;const render2=()=>{oldRender();renderCalendar();renderAnalytics()};render=render2;$("out").onclick=async()=>{await sb.auth.signOut();location.href="../"};
if("Notification" in window && Notification.permission==="default"){setTimeout(()=>Notification.requestPermission(),1200)}
setInterval(()=>{items.filter(x=>x.status==="active").forEach(x=>{const mins=Math.floor((new Date(x.due_at)-Date.now())/60000);const key="notified_"+x.id+"_"+mins;if([1440,360,60].includes(mins)&&!sessionStorage.getItem(key)&&Notification.permission==="granted"){new Notification("Deadline Guardian",{body:x.title+" is due in "+(mins===1440?"24 hours":mins===360?"6 hours":"1 hour")+"."});sessionStorage.setItem(key,"1")}})},60000);
load();
</script></body></html>
