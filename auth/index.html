<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in — Deadline Guardian</title><style>
:root{--bg:#f5f7fb;--panel:#fff;--line:#dfe5ee;--muted:#64748b;--primary:#2563eb;--text:#0f172a;--soft:#eff6ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(180deg,#fff,#f5f7fb 60%,#eef4ff);color:var(--text);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif}.box{width:min(420px,calc(100% - 36px));background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 24px 70px #0f172a14}.brand{font-weight:800;color:var(--primary)}.back{color:#64748b;text-decoration:none}.box h1{font-size:30px;margin:8px 0}.box p{color:var(--muted)}input,select{width:100%;box-sizing:border-box;padding:13px;margin-top:10px;border:1px solid var(--line);border-radius:12px;background:#f8fafc;color:var(--text);outline:none}input:focus{border-color:#93c5fd;box-shadow:0 0 0 3px #2563eb14}button{width:100%;margin-top:12px;padding:13px;border:0;border-radius:12px;background:var(--primary);color:#fff;font-weight:800;cursor:pointer;box-shadow:0 8px 18px #2563eb22}.switch{background:#fff;color:#475569;border:1px solid var(--line);box-shadow:none}.msg{margin-top:12px;padding:11px;border:1px solid var(--line);border-radius:12px;color:#475569;background:#f8fafc}.error{color:#b42318;background:#fff5f5;border-color:#fecaca}.ok{color:#166534;background:#f0fdf4;border-color:#bbf7d0}
</style></head>
<body><main class="box"><a class="back" href="../">← Deadline Guardian</a><div class="brand" style="margin-top:25px">DEADLINE GUARDIAN</div><h1 id="heading">Welcome back</h1><p id="sub">Sign in to manage your deadlines.</p><form id="form"><input id="email" type="email" required placeholder="Email address"><input id="password" type="password" required minlength="6" placeholder="Password (6+ characters)"><button id="submit">Sign in</button></form><button id="toggle" class="switch">New here? Create an account</button><div id="msg"></div></main>
<script type="module">
import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const supabase=createClient("https://jpqbvliaaucyqnhcclbz.supabase.co","sb_publishable_K-0R9a2lSginTIfxHk-cxQ_joorBonP");
let signup=false;
const $=id=>document.getElementById(id);
$("toggle").onclick=()=>{signup=!signup;$("heading").textContent=signup?"Create your account":"Welcome back";$("sub").textContent=signup?"Start your personal deadline hub.":"Sign in to manage your deadlines.";$("submit").textContent=signup?"Create account":"Sign in";$("toggle").textContent=signup?"Already have an account? Sign in":"New here? Create an account";$("msg").textContent=""};
$("form").onsubmit=async e=>{e.preventDefault();$("submit").disabled=true;$("msg").textContent="Working…";const email=$("email").value,password=$("password").value;const r=signup?await supabase.auth.signUp({email,password}):await supabase.auth.signInWithPassword({email,password});$("submit").disabled=false;if(r.error){$("msg").className="msg error";$("msg").textContent=r.error.message;return}if(signup){$("msg").className="msg ok";$("msg").textContent="Account created. If email confirmation is enabled, confirm your email and then sign in.";signup=false;$("heading").textContent="Welcome back";$("submit").textContent="Sign in";return}location.href="../dashboard/"};
</script></body></html>
